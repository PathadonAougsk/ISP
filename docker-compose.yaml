services:
  frontend-dev:
    build:
      context: "./source/frontend"
      dockerfile: "dockerfile"
    command: "npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./source/frontend:/app
      - /app/node_modules
  backend-dev:
    build:
      context: "./source/backend"
      dockerfile: "dockerfile"
    env_file: "./source/.env"
    command: "fastapi dev --host 0.0.0.0 --port 8000 app/main.py"
    ports:
      - "8000:8000"
    volumes:
      - ./source/backend:/Backend
