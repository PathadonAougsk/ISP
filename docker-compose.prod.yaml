services:
  nextjs:
    build:
      context: ./source/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in source/.env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in source/.env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in source/.env}
    image: isp-frontend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy

  fastapi:
    build:
      context: ./source/backend
      dockerfile: Dockerfile
    image: isp-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./source/.env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
      fastapi:
        condition: service_healthy
